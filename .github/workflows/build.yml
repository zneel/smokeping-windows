name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The daemon and its tests are platform independent, so they are built and run
  # on Linux where CI minutes are cheapest.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build daemon and tests
        run: dotnet build src/SmokePing.Net/SmokePing.Net.csproj tests/SmokePing.Net.Tests/SmokePing.Net.Tests.csproj --configuration Release

      # rrdtool is the oracle for the RRD compatibility tests, which skip
      # themselves without it.
      - name: Install rrdtool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rrdtool
        if: runner.os == 'Linux'

      - name: Run tests
        run: dotnet test tests/SmokePing.Net.Tests --configuration Release --no-build --logger trx --results-directory test-results

      - name: Validate the sample configuration
        run: dotnet run --project src/SmokePing.Net --configuration Release --no-build -- --config "$PWD/config/smokeping.json" --check

  # The daemon targets Windows first, so it is also built and tested there.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build the whole solution
        run: dotnet build SmokePing.Net.sln --configuration Release

      # rrdtool is the oracle for the RRD compatibility tests, which skip
      # themselves without it.
      - name: Install rrdtool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rrdtool
        if: runner.os == 'Linux'

      - name: Run tests
        run: dotnet test tests/SmokePing.Net.Tests --configuration Release --no-build --logger trx --results-directory test-results

      - name: Publish the daemon
        run: dotnet publish src/SmokePing.Net/SmokePing.Net.csproj --configuration Release --output publish/daemon

      - uses: actions/upload-artifact@v4
        with:
          name: smokeping-net-windows
          path: publish/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
